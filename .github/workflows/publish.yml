name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'modules/common/**'

jobs:
  publish:
    runs-on: blacksmith-4-ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish to Island Repository
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        run: ./gradlew :modules:common:publishAllPublicationsToPublicRepository